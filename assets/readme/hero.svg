<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="470" viewBox="0 0 1200 470"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">КЛМ Трасса — конфигуратор шинопровода</title>
  <desc id="heroDesc">Инженер описывает трассу участками, платформа проверяет её по нормам, считает падение напряжения и собирает спецификацию. Показана схема трассы: ввод питания, угол, отвод 250 А, компенсатор, огнестойкая проходка, торцевая заглушка. Результат расчёта: номинал 1600 А, алюминий, IP55, падение напряжения 2,65 процента из допустимых 5, масса трассы 1940 килограммов.</desc>

  <defs>
    <pattern id="snap" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#16303c" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="470" rx="26" fill="#0b1a21"/>
  <rect x="1" y="1" width="1198" height="468" rx="25" fill="url(#snap)" opacity="0.45"/>

  <!-- знак КЛМ: ромбовидная кладка логотипа -->
  <g transform="translate(83 72) scale(0.72)" fill="#7DC800">
    <path d="M0 -27 L9 -18 L0 -9 L-9 -18 Z"/>
    <path d="M-9 -18 L0 -9 L-9 0 L-18 -9 Z"/>
    <path d="M9 -18 L18 -9 L9 0 L0 -9 Z"/>
    <path d="M-18 -9 L-9 0 L-18 9 L-27 0 Z"/>
    <path d="M0 -9 L9 0 L0 9 L-9 0 Z"/>
    <path d="M18 -9 L27 0 L18 9 L9 0 Z"/>
  </g>

  <g id="title-block">
    <text x="120" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" letter-spacing="2.4" fill="#7DC800">КОНФИГУРАТОР ШИНОПРОВОДА</text>

    <text x="64" y="164" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-1.5">КЛМ Трасса</text>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" fill="#9db4c0">
      <text x="64" y="210">Инженер описывает трассу участками.</text>
      <text x="64" y="244">Платформа проверяет её по нормам, считает падение</text>
      <text x="64" y="278">напряжения и собирает спецификацию из геометрии.</text>
    </g>
  </g>

  <!-- результат расчёта: реальный вывод ядра -->
  <g id="result">
    <rect x="806" y="60" width="330" height="222" rx="16" fill="#0f2530" stroke="#24404c" stroke-width="1.5"/>
    <text x="834" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" letter-spacing="1.6" fill="#7f97a3">РЕЗУЛЬТАТ РАСЧЁТА</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="834" y="134" font-size="18" fill="#7f97a3">номинал</text>
      <text x="1108" y="134" font-size="21" fill="#ffffff" text-anchor="end">1600 А · Al</text>

      <text x="834" y="180" font-size="18" fill="#7f97a3">ΔU</text>
      <text x="1108" y="180" font-size="21" fill="#5fdcea" text-anchor="end">2,65 % из 5 %</text>

      <text x="834" y="226" font-size="18" fill="#7f97a3">масса</text>
      <text x="1108" y="226" font-size="21" fill="#ffffff" text-anchor="end">1940 кг</text>
    </g>

    <path d="M834 250 H1108" stroke="#24404c" stroke-width="1.5"/>
    <text x="834" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="17" fill="#7DC800">R и X — каталог KLM V3</text>
  </g>

  <!-- схема трассы: то, что описывает инженер -->
  <g id="route">
    <path d="M100 342 H330 L348 360 H1090" fill="none" stroke="#2c4a57" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 342 H330 L348 360 H1090" fill="none" stroke="#00aec0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="88" y="330" width="24" height="24" rx="5" fill="#00aec0"/>
    <path d="M339 338 L352 351 L339 364 L326 351 Z" fill="#0b1a21" stroke="#00aec0" stroke-width="3"/>

    <path d="M540 360 V384" stroke="#00aec0" stroke-width="3"/>
    <rect x="522" y="384" width="36" height="24" rx="5" fill="#00aec0"/>

    <g stroke="#00aec0" stroke-width="3" fill="none">
      <path d="M716 346 V374"/><path d="M730 346 V374"/><path d="M744 346 V374"/>
    </g>

    <rect x="891" y="338" width="38" height="44" rx="5" fill="#0b1a21" stroke="#7DC800" stroke-width="3"/>
    <path d="M899 350 H921 M899 360 H921 M899 370 H921" stroke="#7DC800" stroke-width="2"/>

    <path d="M1078 344 H1096 V376 H1078 Z" fill="#00aec0"/>

    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" fill="#8ba4b0">
      <text x="88" y="314">Ввод питания</text>
      <text x="339" y="314" text-anchor="middle">Угол</text>
      <text x="730" y="314" text-anchor="middle">Компенсатор</text>
      <text x="910" y="314" text-anchor="middle">Проходка</text>
      <text x="1096" y="314" text-anchor="end">Заглушка</text>
      <text x="540" y="428" text-anchor="middle" fill="#a8bcc6">Отвод 250 А</text>
    </g>
  </g>
</svg>
